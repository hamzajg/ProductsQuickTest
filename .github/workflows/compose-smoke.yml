name: Compose smoke test

# Brings the real docker-compose stack up (gateway + the three Quarkus
# services, built from the fast-jar Dockerfiles on JDK 17) and drives it
# through the gateway. The image-build workflow proves each image builds; this
# proves they boot, that the gateway's routes resolve to the right service, and
# that a request through the gateway reaches the in-memory repository and back.
# The checkout step also exercises the orders service's service-to-service calls
# (customer lookup + stock reservation), which only resolve inside the compose
# network.
#
# Deliberately does not start `webapp`: the React bundle is not part of the
# routing contract and its build would only add minutes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Gateway routes to products, customers and orders
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Compose version
        run: docker compose version

      - name: Build and start gateway, products, customers, orders
        run: docker compose up --build --detach gateway products customers orders

      - name: Wait for the products route through the gateway
        # The services build inside their images, so the first boot is the slow
        # part; a 503 from the gateway means "not yet", not "broken".
        run: |
          set -uo pipefail
          for attempt in $(seq 1 60); do
            code=$(curl --silent --output /tmp/products.json --write-out '%{http_code}' \
              http://localhost:8080/api/v1/products/all || true)
            echo "attempt ${attempt}: ${code}"
            if [ "${code}" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::gateway never served /api/v1/products/all"
          exit 1

      - name: Products route answers through the gateway
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output /tmp/products.json \
            --write-out '%{http_code}' http://localhost:8080/api/v1/products/all)
          echo "status ${code}"
          cat /tmp/products.json; echo
          test "${code}" = "200"
          grep --quiet '"items"' /tmp/products.json

      - name: Product categories route reaches the products service
        # A second gateway route pointed at the same upstream; proves the
        # gateway config, not just one path, resolves.
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output /tmp/categories.json \
            --write-out '%{http_code}' http://localhost:8080/api/v1/product-categories/all)
          echo "status ${code}"
          cat /tmp/categories.json; echo
          test "${code}" = "200"
          grep --quiet '"items"' /tmp/categories.json

      - name: Customers route carries a write and reads it back
        # Creates through the gateway, then reads the same service's list: a
        # pass means the request reached the customers container's in-memory
        # repository, was stored, and came back out through the same route.
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output /tmp/created.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"firstName":"Smoke","lastName":"Route","address":"1 Gateway Way","email":"smoke@test.local","mobile":"1000"}' \
            http://localhost:8080/api/v1/customers/create)
          echo "create status ${code}"
          cat /tmp/created.json; echo
          test "${code}" = "200"

          code=$(curl --silent --show-error --output /tmp/customers.json \
            --write-out '%{http_code}' http://localhost:8080/api/v1/customers/all)
          echo "list status ${code}"
          cat /tmp/customers.json; echo
          test "${code}" = "200"
          grep --quiet 'Smoke' /tmp/customers.json

          # The checkout below needs this customer's id; publish it to later steps.
          CUSTOMER_ID=$(python3 -c "import json;print(json.load(open('/tmp/created.json'))['id'])")
          echo "CUSTOMER_ID=${CUSTOMER_ID}" >> "$GITHUB_ENV"

      - name: Wait for the orders route through the gateway
        run: |
          set -uo pipefail
          for attempt in $(seq 1 60); do
            code=$(curl --silent --output /tmp/orders.json --write-out '%{http_code}' \
              http://localhost:8080/api/v1/orders/all || true)
            echo "attempt ${attempt}: ${code}"
            if [ "${code}" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::gateway never served /api/v1/orders/all"
          exit 1

      - name: Orders route carries a checkout and reads it back
        # The money shot: a category, a product and a customer are created
        # through the gateway, then POST /api/v1/orders/create makes the orders
        # service call the other two services by container name (verify the
        # customer, reserve the stock). The placed order is read back through the
        # same route, both as a list and by id.
        run: |
          set -euo pipefail

          code=$(curl --silent --show-error --output /tmp/category.json \
            --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data '{"name":"Smoke category"}' \
            http://localhost:8080/api/v1/product-categories/create)
          echo "category status ${code}"; cat /tmp/category.json; echo
          test "${code}" = "200"
          CATEGORY_ID=$(python3 -c "import json;print(json.load(open('/tmp/category.json'))['id'])")

          code=$(curl --silent --show-error --output /tmp/product.json \
            --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data "{\"name\":\"Smoke widget\",\"categoryId\":\"${CATEGORY_ID}\",\"unitPrice\":5.0,\"discount\":0,\"availableQty\":10}" \
            http://localhost:8080/api/v1/products/create)
          echo "product status ${code}"; cat /tmp/product.json; echo
          test "${code}" = "200"
          PRODUCT_ID=$(python3 -c "import json;print(json.load(open('/tmp/product.json'))['id'])")

          code=$(curl --silent --show-error --output /tmp/order.json \
            --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data "{\"customerId\":\"${CUSTOMER_ID}\",\"items\":[{\"productId\":\"${PRODUCT_ID}\",\"qty\":2}]}" \
            http://localhost:8080/api/v1/orders/create)
          echo "order status ${code}"; cat /tmp/order.json; echo
          test "${code}" = "200"
          grep --quiet 'PLACED' /tmp/order.json
          ORDER_ID=$(python3 -c "import json;print(json.load(open('/tmp/order.json'))['orderId'])")

          code=$(curl --silent --show-error --output /tmp/orders.json \
            --write-out '%{http_code}' http://localhost:8080/api/v1/orders/all)
          echo "list status ${code}"; cat /tmp/orders.json; echo
          test "${code}" = "200"
          grep --quiet "${ORDER_ID}" /tmp/orders.json

          code=$(curl --silent --show-error --output /tmp/order-by-id.json \
            --write-out '%{http_code}' "http://localhost:8080/api/v1/orders/${ORDER_ID}")
          echo "by-id status ${code}"; cat /tmp/order-by-id.json; echo
          test "${code}" = "200"
          grep --quiet "${ORDER_ID}" /tmp/order-by-id.json

      - name: Unrouted path is not proxied
        run: |
          set -euo pipefail
          code=$(curl --silent --output /tmp/unknown.txt --write-out '%{http_code}' \
            http://localhost:8080/api/v1/not-a-route)
          echo "status ${code}"
          test "${code}" = "404"

      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
