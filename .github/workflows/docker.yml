name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: webapp
            file: src/webapp/Dockerfile
            context: .
          - name: apigateway
            file: src/ApiGateway/Dockerfile
            context: .
          - name: product-fast-jar
            file: src/Product/Product.WebApi/Dockerfile.fast-jar
            context: .
          - name: customer-fast-jar
            file: src/Customer/Customer.WebApi/Dockerfile.fast-jar
            context: .
          - name: order-fast-jar
            file: src/Order/Order.WebApi/Dockerfile.fast-jar
            context: .
    steps:
      - uses: actions/checkout@v5

      - name: docker build
        # No push: the job exists to prove the image still builds.
        run: docker build --file "${{ matrix.file }}" --tag "ci-image-${{ matrix.name }}:latest" "${{ matrix.context }}"
