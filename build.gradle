allprojects {
    group 'com.hamzajg.quicktest'
    version '1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply 'plugin': 'java'

    // Several modules carry test sources without discoverable tests; Gradle 9
    // treats that as an error unless it is explicitly allowed.
    tasks.withType(Test).configureEach {
        failOnNoDiscoveredTests = false
    }
}

