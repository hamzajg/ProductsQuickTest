spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: customers
          uri: http://customers:8082
          predicates:
            - Path=/api/v1/customers/**
        - id: products
          uri: http://products:8081
          predicates:
            - Path=/api/v1/products/**
        - id: product-categories
          uri: http://products:8081
          predicates:
            - Path=/api/v1/product-categories/**
        - id: orders
          uri: http://orders:8083
          predicates:
            - Path=/api/v1/orders/**
      globalcors:
        corsConfigurations:
          '[/**]':
            # Spring rejects allowedOrigins "*" together with
            # allowCredentials: true (CorsConfiguration.validateAllowCredentials
            # throws IllegalArgumentException, which surfaces as a 500 on every
            # request). Zuul tolerated it, so the swap to Spring Cloud Gateway
            # broke all traffic silently. allowedOriginPatterns is the
            # supported way to combine a wildcard with credentials.
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
