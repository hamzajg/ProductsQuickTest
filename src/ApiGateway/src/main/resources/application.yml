spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: customers
          uri: http://customers:8082
          predicates:
            - Path=/api/v1/customers/**
        - id: products
          uri: http://products:8081
          predicates:
            - Path=/api/v1/products/**
        - id: product-categories
          uri: http://products:8081
          predicates:
            - Path=/api/v1/product-categories/**
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
