quarkus.http.port=8083
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000, https://marketplace-c7803.web.app/, http://localhost:8080/, https://da481e79a470.ngrok.io/
quarkus.http.cors.headers=accept, origin, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, POST, OPTIONS, PATCH, DELETE
quarkus.swagger-ui.always-include=true

# Service-to-service calls. The orders service is the first caller of the other
# two services; these names resolve inside the compose network. Tests replace
# the gateways, so they never dial these URLs.
quarkus.rest-client.products.url=http://products:8081
quarkus.rest-client.customers.url=http://customers:8082

# Order.Application/Infrastructure are plain library jars with no Jandex index,
# so Arc would never discover PlaceOrderUseCase or the REST-client gateways.
# Unlike the other services (whose facades `new` their collaborators by hand),
# the orders service needs CDI to inject the MicroProfile @RestClient beans, so
# its library modules must be indexed.
quarkus.index-dependency.order-application.group-id=com.hamzajg.quicktest
quarkus.index-dependency.order-application.artifact-id=Order.Application
quarkus.index-dependency.order-infrastructure.group-id=com.hamzajg.quicktest
quarkus.index-dependency.order-infrastructure.artifact-id=Order.Infrastructure
